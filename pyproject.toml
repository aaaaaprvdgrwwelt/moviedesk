[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moviedesk"
version = "0.1.0"
description = "Ein Dateimanager nur fuer Filme und Serien: sichten, Metadaten holen, umbenennen"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    # Gemeinsames Grundgeruest mit den anderen *desk-Apps (siehe
    # ../deskkit) - noch kein eigenes Repo/PyPI-Paket, deshalb per
    # `pip install -r requirements.txt` (editable) statt hier direkt
    # aufloesbar.
    "deskkit",
    "PySide6>=6.6",
    "requests>=2.31",
    "pillow>=11.3",
    "send2trash>=1.8",
    # API-Schluessel im System-Schluesselbund statt im Klartext in
    # QSettings - siehe deskkit.secrets.
    "keyring>=24",
]

[project.urls]
Homepage = "https://github.com/aaaaaprvdgrwwelt/moviedesk"

[project.scripts]
moviedesk = "moviedesk.__main__:main"

[tool.setuptools.packages.find]
include = ["moviedesk*"]

[tool.ruff]
target-version = "py310"
line-length = 92

[tool.ruff.lint]
select = ["E", "F", "UP", "B"]
ignore = [
    "E501",  # Zeilenlaenge wird von Hand umgebrochen, nicht erzwungen
    "B008",  # QModelIndex() als Vorgabewert ist die uebliche Qt-Modell-Signatur
]
